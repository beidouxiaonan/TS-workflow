server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
spring:
  application:
    name: knowledge-ticket-api
  datasource:
    url: ${DB_URL:jdbc:oceanbase://127.0.0.1:2881/knowledge_ticket?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root@test}
    password: ${DB_PASSWORD:}
    driver-class-name: com.oceanbase.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}
  sql:
    init:
      mode: ${DB_INIT_MODE:never}
      schema-locations: classpath:db/schema-oceanbase.sql
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSSXXX
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  packages-to-scan: com.zhixing.ticket.controller
